<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پخته شدن</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07110e;--card:#111f1a;--tx:#f2ebd3;--mut:#9aa89f;--gold:#d4af37;--em:#2ecc8f;--ro:#7b4fd6;--ink:#000;--bd:color-mix(in srgb,var(--mut) 28%,transparent);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f3e8;--card:#fff;--tx:#1b2a24;--mut:#5d6b64;--gold:#a8841a;--em:#17996a;--ro:#6a3fc4;--ink:#fff}}
:root[data-theme="light"]{--bg:#f6f3e8;--card:#fff;--tx:#1b2a24;--mut:#5d6b64;--gold:#a8841a;--em:#17996a;--ro:#6a3fc4;--ink:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:auto}
main{flex:1;overflow:auto;padding:16px}
h1{color:var(--gold);margin:0 0 2px;font-size:24px}
.card{background:var(--card);border-radius:22px;padding:18px;margin:12px 0;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.mut{color:var(--mut);font-size:13px}.gold{color:var(--gold)}.em{color:var(--em)}.ro{color:var(--ro)}
.bar{height:10px;border-radius:9px;background:var(--bg);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--em),var(--gold));border-radius:9px;transition:width .8s ease}
nav{display:flex;background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:8px 2px;border-radius:14px;cursor:pointer}
nav button.on{background:var(--gold);color:var(--ink);font-weight:700}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;font:inherit;margin:4px 0}
.btn{background:var(--gold);color:var(--ink);border:0;border-radius:14px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row .fit{flex:none}
.item{display:flex;gap:10px;align-items:center}.item .t{flex:1}
.item.done .t b{text-decoration:line-through;opacity:.55}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--em);margin:0}
.x{background:none;border:0;color:var(--ro);font-size:20px;cursor:pointer;flex:none}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:10px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.bars b{display:block;border-radius:8px 8px 0 0;background:var(--em);min-height:3px;transition:height .8s}
.tag{background:var(--ro);color:#fff;border-radius:9px;padding:2px 8px;font-size:11px}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:max(18px,calc(50% - 262px));width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:var(--ink);font-size:32px;box-shadow:0 6px 18px #0006;cursor:pointer;z-index:10}
.bk{position:fixed;inset:0;background:#000a;z-index:20}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:auto;max-height:92vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:21}
.sh.new{animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}}
.grip{width:44px;height:5px;border-radius:5px;background:var(--mut);margin:0 auto 8px;opacity:.5}
.lb{font-size:13px;color:var(--em);margin:14px 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.chip{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:9px 15px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.sum{background:var(--bg);border-radius:14px;padding:11px 13px;margin-top:14px;font-size:13px}
input,select{font-size:16px}
.mdl{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:420px;margin:auto;background:var(--card);border-radius:26px;padding:22px;z-index:31;animation:in .3s ease;box-shadow:0 10px 40px #0008;max-height:90vh;overflow:auto}
#ov .bk{z-index:30}
.big{font-size:58px;font-weight:700;text-align:center;color:var(--em);direction:ltr;margin:8px 0}
</style>
</head>
<body>
<main id="v"></main>
<nav id="nav"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const MN=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const WD=["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"];
const PER={daily:"روزانه",weekly:"هفتگی",monthly:"ماهانه",yearly:"سالانه"};
const TERM={short:"کوتاه‌مدت",mid:"میان‌مدت",long:"بلندمدت"};
const fa=s=>String(s).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function jal(gy,gm,gd){const d=[0,31,59,90,120,151,181,212,243,273,304,334],g2=gm>2?gy+1:gy;
let n=355666+365*gy+Math.floor((g2+3)/4)-Math.floor((g2+99)/100)+Math.floor((g2+399)/400)+gd+d[gm-1];
let y=-1595+33*Math.floor(n/12053);n%=12053;y+=4*Math.floor(n/1461);n%=1461;
if(n>365){y+=Math.floor((n-1)/365);n=(n-1)%365}
return[y,n<186?1+Math.floor(n/31):7+Math.floor((n-186)/30),1+(n<186?n%31:(n-186)%30)]}
const jt=dt=>{const[y,m,d]=jal(dt.getFullYear(),dt.getMonth()+1,dt.getDate());return`${WD[dt.getDay()]} ${fa(d)} ${MN[m-1]} ${fa(y)}`};
const iso=dt=>{const p=n=>String(n).padStart(2,"0");return`${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`};
let S={plans:[],goals:[]},tab=0;
try{S=Object.assign(S,JSON.parse(localStorage.getItem("pakhteh")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("pakhteh",JSON.stringify(S))}catch(e){}};
const startOf=p=>new Date(p.date+"T"+p.s);
const timers={};
function ring(t,b){try{if(window.Notification&&Notification.permission==="granted")new Notification(t,{body:b})}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}beep()}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.2);o.start();o.stop(a.currentTime+1.2)}catch(e){}}
function arm(){Object.values(timers).forEach(clearTimeout);
S.plans.filter(p=>!p.done).forEach(p=>{const st=startOf(p)-Date.now(),en=new Date(p.date+"T"+p.e)-Date.now();
const put=(k,ms,f)=>{if(ms>0&&ms<2147483000)timers[p.id+k]=setTimeout(f,ms)};
if(p.rem)put("r",st-p.rem*60000,()=>ring(p.title,`${fa(p.rem)} دقیقه دیگر شروع می‌شود • ${msg(p).t}`));
put("s",st,()=>{ring(p.title,"وقتشه! "+msg(p).m);showAlarm(p.id)});
put("e",en,()=>{ring("جا موندی؟","«"+p.title+"» به یادآوری‌ها رفت. هر وقت آماده بودی انجامش بده.");if(tab==2)draw();else nav()})})}
const TABS=["خانه","برنامه‌ها","یادآوری‌ها","اهداف","گزارش"];
function nav(){document.getElementById("nav").innerHTML=TABS.map((t,i)=>`<button class="${i==tab?"on":""}" onclick="tab=${i};draw()">${t}${i==2&&missed().length?` <span class="tag">${fa(missed().length)}</span>`:""}</button>`).join("")}
function home(){const now=new Date(),td=S.plans.filter(p=>p.date==iso(now)),dn=td.filter(p=>p.done).length,pc=td.length?Math.round(dn/td.length*100):0;
const nx=S.plans.filter(p=>!p.done&&startOf(p)>now).sort((a,b)=>startOf(a)-startOf(b))[0];
const late=S.plans.filter(p=>!p.done&&new Date(p.date+"T"+p.e)<now);
let nxt="برنامهٔ پیش‌رویی ثبت نشده است";if(nx){const m=Math.round((startOf(nx)-now)/60000);nxt=`<b>${esc(nx.title)}</b><div class="gold">${fa(nx.s)} • ${fa(Math.floor(m/60))} ساعت و ${fa(m%60)} دقیقه دیگر</div>`}
return`<h1>سلام، خوش آمدی</h1><div class="mut"><span id="clk"></span></div>
<div class="card"><b class="em">پیشرفت امروز: ${fa(pc)}٪</b><div class="bar"><i style="width:${pc}%"></i></div>
<div class="mut">کل: ${fa(td.length)} | انجام‌شده: ${fa(dn)} | باقی‌مانده: ${fa(td.length-dn)}</div></div>
<div class="card"><b class="ro">برنامهٔ بعدی</b><div style="margin-top:6px">${nxt}</div></div>
<div class="card"><b class="gold">جملهٔ امروز</b><div style="margin-top:6px">${msg({id:1,title:""}).m}</div></div>
<div class="card" onclick="tab=2;draw()"><b class="gold">عقب‌افتاده‌ها</b><div style="margin-top:6px">${late.length?late.map(p=>`<div>• ${esc(p.title)} <span class="mut">(${fa(p.date)})</span></div>`).join(""):"<span class=mut>هیچ کار عقب‌افتاده‌ای نداری 🎉</span>"}</div></div>
<div class="card"><b class="gold">اهداف مهم</b>${S.goals.slice(0,3).map(g=>`<div style="margin-top:8px">${esc(g.title)} <span class="em">${fa(gp(g))}٪</span><div class="bar"><i style="width:${gp(g)}%"></i></div></div>`).join("")||"<div class=mut style='margin-top:6px'>هنوز هدفی ثبت نشده است</div>"}</div>`}
function plans(){const L=[...S.plans].sort((a,b)=>startOf(a)-startOf(b));
return`<h1>برنامه‌های من</h1><button class="fab" onclick="openSheet()" aria-label="برنامهٔ جدید">+</button>
${L.map(p=>{const[y,m,d]=jal(...p.date.split("-").map(Number));return`<div class="card item ${p.done?"done":""}"><input type="checkbox" ${p.done?"checked":""} onchange="tog(${p.id})"><div class="t"><b>${esc(p.title)}</b> <span class="tag">${PER[p.period]}</span>
<div class="gold" style="font-size:13px">${fa(d)} ${MN[m-1]} • ${fa(p.s)} تا ${fa(p.e)}</div>${p.note?`<div class="mut">${esc(p.note)}</div>`:""}</div><button class="x" onclick="delPlan(${p.id})">✕</button></div>`}).join("")||'<div class="mut">هنوز برنامه‌ای ثبت نکرده‌ای.</div>'}`}
const gp=g=>g.steps.length?Math.round(g.steps.filter(s=>s.d).length/g.steps.length*100):0;
function goals(){return`<h1>اهداف من</h1>
<div class="card"><input id="gt" placeholder="عنوان هدف"><div class="row"><select id="gm">${Object.entries(TERM).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><input id="gd" type="date"></div>
<button class="btn" style="width:100%;margin-top:8px" onclick="addGoal()">افزودن هدف</button></div>
${S.goals.map(g=>`<div class="card"><div class="item"><div class="t"><b>${esc(g.title)}</b> <span class="tag">${TERM[g.term]}</span>${g.due?`<span class="mut"> تا ${fa(g.due)}</span>`:""}</div><b class="em">${fa(gp(g))}٪</b><button class="x" onclick="delGoal(${g.id})">✕</button></div>
<div class="bar"><i style="width:${gp(g)}%"></i></div>
${g.steps.map((s,i)=>`<label class="item ${s.d?"done":""}" style="margin:6px 0"><input type="checkbox" ${s.d?"checked":""} onchange="togStep(${g.id},${i})"><span class="t"><b>${esc(s.t)}</b></span></label>`).join("")}
<div class="row"><input id="st${g.id}" placeholder="مرحلهٔ جدید"><button class="btn fit" onclick="addStep(${g.id})">+</button></div></div>`).join("")||'<div class="mut">هنوز هدفی ثبت نشده است.</div>'}`}
function rep(){const now=new Date(),days=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);days.push(d)}
const per=days.map(d=>{const L=S.plans.filter(p=>p.date==iso(d));return{d,t:L.length,n:L.filter(p=>p.done).length}});
const T=per.reduce((a,x)=>a+x.t,0),N=per.reduce((a,x)=>a+x.n,0),mx=Math.max(1,...per.map(x=>x.t));
const best=[...per].sort((a,b)=>b.n-a.n)[0];
const ms=S.plans.filter(p=>p.date.slice(0,7)==iso(now).slice(0,7)),md=ms.filter(p=>p.done).length;
const gd=S.goals.filter(g=>g.steps.length&&gp(g)==100).length;
return`<h1>گزارش پیشرفت من</h1>
<div class="card"><b class="gold">۷ روز اخیر</b><div class="mut">ثبت‌شده: ${fa(T)} | انجام‌شده: ${fa(N)} | موفقیت: ${fa(T?Math.round(N/T*100):0)}٪</div>
<div class="bars">${per.map(x=>`<div><b style="height:${x.t/mx*100}px;opacity:.35"></b><b style="height:${x.n/mx*100}px;margin-top:-${x.n/mx*100}px;position:relative"></b>${fa(jal(x.d.getFullYear(),x.d.getMonth()+1,x.d.getDate())[2])}</div>`).join("")}</div>
<div class="mut" style="margin-top:8px">${best&&best.n?`پرکارترین روز: ${WD[best.d.getDay()]}`:"هنوز کاری انجام نشده"}</div></div>
<div class="card"><b class="gold">این ماه</b><div class="bar"><i style="width:${ms.length?md/ms.length*100:0}%"></i></div><div class="mut">${fa(md)} از ${fa(ms.length)} برنامه انجام شده</div></div>
<div class="card"><b class="gold">اهداف</b><div class="mut">تکمیل‌شده: ${fa(gd)} از ${fa(S.goals.length)}</div></div>
${exportCard()}`}
function exp(){const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S));a.download="pakhteh-backup.json";a.click()}
const V=[home,plans,remind,goals2,rep];
function draw(){nav();document.getElementById("v").innerHTML=V[tab]();tick()}
function tick(){const c=document.getElementById("clk");if(c){const n=new Date();c.textContent=jt(n)+" • "+fa(n.toTimeString().slice(0,8))}}
setInterval(tick,1000);
const id=()=>Date.now()+Math.floor(Math.random()*1000);
function addPlan(){const t=F.title.trim();if(!t){document.getElementById("ti").focus();return}const[gy,gm,gd]=j2g(F.jy,F.jm,F.jd),[eh,em]=endT();S.plans.push({id:id(),title:t,note:F.note.trim(),date:`${gy}-${p2(gm)}-${p2(gd)}`,s:`${p2(F.h)}:${p2(F.m)}`,e:`${p2(eh)}:${p2(em)}`,period:F.per,pri:F.pri,rem:F.rem,done:false});closeSheet();
try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission()}catch(e){}save();arm();draw()}
function tog(i){const p=S.plans.find(x=>x.id==i);p.done=!p.done;save();arm();draw()}
function delPlan(i){S.plans=S.plans.filter(x=>x.id!=i);save();arm();draw()}
function addGoal(){const t=gt.value.trim();if(!t)return;S.goals.push({id:id(),title:t,term:gm.value,due:gd.value,steps:[]});save();draw()}
function delGoal(i){S.goals=S.goals.filter(x=>x.id!=i);save();draw()}
function addStep(i){const el=document.getElementById("st"+i),t=el.value.trim();if(!t)return;S.goals.find(g=>g.id==i).steps.push({t,d:false});save();draw()}
function togStep(i,k){const s=S.goals.find(g=>g.id==i).steps[k];s.d=!s.d;save();draw()}
function j2g(jy,jm,jd){jy+=1595;let n=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*Math.floor(n/146097);n%=146097;
if(n>36524){gy+=100*Math.floor(--n/36524);n%=36524;if(n>=365)n++}gy+=4*Math.floor(n/1461);n%=1461;if(n>365){gy+=Math.floor((n-1)/365);n=(n-1)%365}
let gd=n+1;const a=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;for(;gm<13&&gd>a[gm];gm++)gd-=a[gm];return[gy,gm,gd]}
const p2=n=>String(n).padStart(2,"0");
let F=null;
function setDate(o){const d=new Date();d.setDate(d.getDate()+o);[F.jy,F.jm,F.jd]=jal(d.getFullYear(),d.getMonth()+1,d.getDate());F.off=o}
function openSheet(){F={title:"",note:"",h:9,m:0,dur:60,per:"daily",pri:1,rem:0};setDate(0);paint();try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission()}catch(e){}}
function closeSheet(){F=null;paint()}
function endT(){const t=F.h*60+F.m+F.dur;return[Math.floor(t/60)%24,t%60]}
function chips(k,list){return list.map(([l,v])=>`<button class="chip ${F[k]===v?"on":""}" onclick="F.${k}=${typeof v==="string"?`'${v}'`:v};paint()">${l}</button>`).join("")}
function opts(a,sel){return a.map(([l,v])=>`<option value="${v}" ${v==sel?"selected":""}>${l}</option>`).join("")}
function paint(){let el=document.getElementById("sheet");if(!F){if(el)el.remove();return}
const isNew=!el;if(!el){el=document.createElement("div");el.id="sheet";document.body.appendChild(el)}
const oldSh=el.querySelector(".sh"),st=oldSh?oldSh.scrollTop:0;
const dc=F.jm<=6?31:F.jm<=11?30:29;if(F.jd>dc)F.jd=dc;const n=new Date(),cy=jal(n.getFullYear(),n.getMonth()+1,n.getDate())[0],[eh,em]=endT();
const rng=(a,b,s=1)=>{const r=[];for(let i=a;i<=b;i+=s)r.push(i);return r};
const[gy,gm,gd]=j2g(F.jy,F.jm,F.jd),dd=new Date(gy,gm-1,gd);
el.innerHTML=`<div class="bk" onclick="closeSheet()"></div><div class="sh ${isNew?"new":""}"><div class="grip"></div><div class="item"><h1 class="t" style="font-size:20px">برنامهٔ جدید</h1><button class="x" onclick="closeSheet()">✕</button></div>
<input id="ti" placeholder="چه برنامه‌ای داری؟" value="${esc(F.title)}" oninput="F.title=this.value">
<textarea rows="2" placeholder="یادداشت (اختیاری)" oninput="F.note=this.value">${esc(F.note)}</textarea>
<div class="lb">تاریخ</div><div class="chips">${chips("off",[["امروز",0],["فردا",1],["پس‌فردا",2],["هفتهٔ بعد",7]])}</div>
<div class="row" style="margin-top:6px"><select onchange="F.jd=+this.value;F.off=null;paint()">${opts(rng(1,dc).map(x=>[fa(x),x]),F.jd)}</select><select onchange="F.jm=+this.value;F.off=null;paint()">${opts(MN.map((x,i)=>[x,i+1]),F.jm)}</select><select onchange="F.jy=+this.value;F.off=null;paint()">${opts(rng(cy,cy+4).map(x=>[fa(x),x]),F.jy)}</select></div>
<div class="lb">ساعت شروع</div><div class="row" dir="ltr"><select onchange="F.h=+this.value;paint()">${opts(rng(0,23).map(x=>[fa(p2(x)),x]),F.h)}</select><b class="fit">:</b><select onchange="F.m=+this.value;paint()">${opts(rng(0,55,5).map(x=>[fa(p2(x)),x]),F.m)}</select></div>
<div class="lb">مدت</div><div class="chips">${chips("dur",[["۱۵ دقیقه",15],["۳۰ دقیقه",30],["۱ ساعت",60],["۲ ساعت",120],["۴ ساعت",240]])}</div>
<div class="lb">بازه</div><div class="chips">${chips("per",Object.entries(PER).map(([k,v])=>[v,k]))}</div>
<div class="lb">اولویت</div><div class="chips">${chips("pri",[["کم",0],["متوسط",1],["زیاد",2]])}</div>
<div class="lb">یادآوری</div><div class="chips">${chips("rem",[["سر وقت",0],["۱۰ دقیقه قبل",10],["۳۰ دقیقه قبل",30],["۱ ساعت قبل",60]])}</div>
